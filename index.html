<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Honey Home</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#fffaf0;color:#3c2b18}

header{background:#5c3b1e;color:white;padding:25px;text-align:center}

header h1{margin:0;font-size:35px}

nav{padding:12px;text-align:center;background:#ead8b6}

nav a{color:#543515;margin:0 12px;text-decoration:none;font-weight:bold}

.hero{text-align:center;padding:55px 20px;background:linear-gradient(135deg,#f4d58a,#fff3d4)}

.hero h2{font-size:32px;margin:0 0 10px}

.hero p{font-size:17px}

button{background:#8b5e2b;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}

button:hover{background:#65421e}

.container{max-width:1000px;margin:auto;padding:25px}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}

.card{background:white;border-radius:15px;padding:20px;text-align:center;box-shadow:0 3px 12px #0001}

.product-image{height:180px;background:#fff0c6;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:90px}

.card h3{margin-bottom:8px}

.price{color:#a36518;font-size:23px;font-weight:bold}

input,textarea,select{width:100%;padding:12px;margin:8px 0;border:1px solid #d6c5a7;border-radius:8px;font-size:16px}
